<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>BOI TOAN TINH YEU</h2>
    <label for="tenban">Nhập tên của bạn</label>
    <input type="text" id="tenban">
    <br>
    <lable for="tendoiphuong">Nhập tên đối phương</lable>
    <input type="text" id="tendoiphuong">
    <br><br>
    <button onclick="xemboi()">Xem kết quả</button>
    <h3 id="ketqua"></h3>

    <script>
        function xemboi(){
            let tenban = document.getElementById("tenban").value;
            let tendoiphuong =document.getElementById("tendoiphuong").value;
            let diem = Math.floor(Math.random()*100)+1;

            if (diem>50) {
                document.getElementById("ketqua").innerHTML=
                tenban + " ❤️ " + tendoiphuong + ": " + diem + "% - Rất hợp";
            }else{
                document.getElementById("ketqua").innerHTML=
                tenban + " ❤️ " + tendoiphuong + ": " + diem + "% - Không nên quen tiếp";
            }
        }
    </script>
</body>
</html>
